name: Export deploy matrix from repository variables
description: Builds a DEPLOYMENT_MATRIX JSON array from individual server variables (name, ip, port, username, path).

inputs:
  deploy_server_name:
    description: Server display name
    required: true
  deploy_server_ip:
    description: Server IP address
    required: true
  deploy_server_port:
    description: SSH port
    required: true
  deploy_server_username:
    description: SSH username
    required: true
  deploy_server_path:
    description: Deployment path on the server
    required: true

outputs:
  DEPLOYMENT_MATRIX:
    description: JSON array for strategy.matrix.server
    value: ${{ steps.export.outputs.DEPLOYMENT_MATRIX }}

runs:
  using: composite
  steps:
    - name: Validate and export matrix JSON
      id: export
      shell: bash
      env:
        SERVER_NAME: ${{ inputs.deploy_server_name }}
        SERVER_IP: ${{ inputs.deploy_server_ip }}
        SERVER_PORT: ${{ inputs.deploy_server_port }}
        SERVER_USERNAME: ${{ inputs.deploy_server_username }}
        SERVER_PATH: ${{ inputs.deploy_server_path }}
      run: |
        set -euo pipefail
        for var in SERVER_NAME SERVER_IP SERVER_PORT SERVER_USERNAME SERVER_PATH; do
          if [ -z "${!var:-}" ]; then
            echo "Input ${var} is empty. Check that all DEPLOY_SERVER_* GitHub variables are set."
            exit 1
          fi
        done
        MATRIX="$(jq -cn '[{
          "name":     env.SERVER_NAME,
          "ip":       env.SERVER_IP,
          "port":     env.SERVER_PORT,
          "username": env.SERVER_USERNAME,
          "path":     env.SERVER_PATH
        }]')"
        delimiter="$(openssl rand -hex 8)"
        {
          echo "DEPLOYMENT_MATRIX<<${delimiter}"
          echo "$MATRIX"
          echo "${delimiter}"
        } >> "${GITHUB_OUTPUT}"